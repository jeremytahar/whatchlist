@if (loading()) {
<p>Chargement...</p>
} @else if (error()) {
<p>{{ error() }}</p>
<button (click)="onReload()">Réessayer</button>
} @else {
@for (tab of tabs; track tab.value) {
<button (click)="activeTab.set(tab.value)" [class.active]="activeTab() === tab.value">{{ tab.label }}</button>
}

@for (item of filteredWatchlist(); track item.id) {
<app-watch-card [item]="item" (statusChange)="onStatusChange(item.id, $event)" (remove)="onRemove(item.id)" />
}
@empty {
<p>{{ activeTab() === 'all' ? 'Ta watchlist est vide' : 'Aucun élément dans cette catégorie' }}</p>
}
}

<a routerLink="watchlist/new" class="btn">Add an item</a>
