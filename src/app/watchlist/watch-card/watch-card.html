<article class="card">
  <a class="poster" [routerLink]="['/watchlist', item().id]" [attr.aria-label]="'Voir le détail de ' + item().Title">
    @if (hasPoster()) {
      <img [src]="item().Poster" [alt]="''" loading="lazy" />
    } @else {
      <span class="poster-empty" aria-hidden="true">?</span>
    }
  </a>

  <div class="body">
    <h3>{{ item().Title }}</h3>
    <p class="meta">{{ typeLabel() }}{{ item().Year ? ', ' + item().Year : '' }}</p>
    <app-star-rating [rating]="item().rating ?? 0" (ratingChange)="rate.emit($event)" />

    <div class="status" role="group" aria-label="Statut">
      @for (s of statuses; track s) {
        <button type="button" (click)="statusChange.emit(s)" [class.active]="item().status === s">
          {{ statusLabels[s] }}
        </button>
      }
    </div>

    <p class="added">Ajouté le {{ item().addedAt | date: 'd MMM y' }}</p>

    <div class="actions">
      <a [routerLink]="['/watchlist', item().id, 'edit']">Modifier</a>
      <button type="button" class="link-danger" (click)="remove.emit()">Supprimer</button>
    </div>
  </div>
</article>
